name: gallery

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-gallery}
      MARIADB_USER: ${DB_USERNAME:-gallery}
      MARIADB_PASSWORD: ${DB_PASSWORD:-gallery_local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-gallery_root_local}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mariadb_data:
