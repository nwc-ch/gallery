name: aurea-gallery
services:
  db:
    image: mariadb:11.8.6
    environment:
      MARIADB_DATABASE: gallery
      MARIADB_USER: gallery
      MARIADB_PASSWORD: gallery-local-only
      MARIADB_ROOT_PASSWORD: gallery-local-root-only
    ports: ["127.0.0.1:33316:3306"]
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 40
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: gallery-local
      MINIO_ROOT_PASSWORD: gallery-local-storage-only
    ports: ["127.0.0.1:33317:9000"]
    volumes: [storage-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 40
  scanner:
    image: clamav/clamav:1.4
    ports: ["127.0.0.1:33318:3310"]
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
volumes:
  db-data:
  storage-data:
  clamav-data:
